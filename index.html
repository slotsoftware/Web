    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyan-neon': '#00e5ff',
                        'blue-neon': '#0066ff',
                        'dark-abyss': '#000205',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s infinite alternate',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { opacity: '0.6', textShadow: '0 0 5px #00e5ff' },
                            '100%': { opacity: '1', textShadow: '0 0 15px #00e5ff, 0 0 25px #0066ff' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }

    <style>
        :root {
            --cyan: #00e5ff;
            --blue-neon: #0066ff;
            --dark-abyss: #000205;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark-abyss); overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #ffffff; user-select: none; touch-action: manipulation;
        }

        #bg-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at 50% 50%, #010a14 0%, var(--dark-abyss) 75%, #000000 100%);
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.25) 51%);
            background-size: 100% 4px; pointer-events: none; opacity: 0.3;
        }

        /* Título de fondo sobre la galaxia */
        #bg-title {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2.5rem, 8vw, 7rem);
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.9), 0 0 80px rgba(0, 102, 255, 0.8), 0 0 120px rgba(0, 229, 255, 0.5);
            z-index: 3;
            pointer-events: none;
            text-align: center;
            line-height: 1.1;
            opacity: 0;
            transition: opacity 4s ease-in-out 1s;
        }
        #bg-title.visible {
            opacity: 1;
        }

        #ui-layer {
            position: relative; z-index: 10; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Pantalla de inicio */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000;
            background-color: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 2s ease-in-out; padding: 20px; text-align: center;
        }
        
        .btn-start {
            font-family: 'Montserrat', sans-serif; font-weight: 300; letter-spacing: 0.4em;
            padding: 16px 32px; background: rgba(0, 10, 25, 0.4); color: var(--cyan);
            cursor: pointer; text-transform: uppercase; font-size: 0.85rem;
            border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 20px rgba(0, 102, 255, 0.15) inset;
            transition: all 0.4s ease; pointer-events: auto; backdrop-filter: blur(5px);
        }
        .btn-start:hover, .btn-start:active { 
            background: rgba(0, 102, 255, 0.2); border-color: var(--cyan);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4) inset, 0 0 20px rgba(0, 102, 255, 0.6); text-shadow: 0 0 10px var(--cyan);
        }

        /* Nav Sup */
        .top-nav {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px 30px;
            display: flex; justify-content: flex-end; align-items: flex-start;
            pointer-events: auto; z-index: 20;
        }
        
        .prometheus-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            letter-spacing: 0.65em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8), 0 0 30px rgba(0, 102, 255, 0.6);
            margin-right: -0.65em;
        }

        /* Menú Modal Constelaciones */
        .menu-modal {
            position: absolute;
            background: linear-gradient(135deg, rgba(0, 10, 25, 0.88) 0%, rgba(0, 5, 15, 0.78) 100%);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 20px; width: 320px; max-height: 75vh; overflow-y: auto;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; transform: scale(0.9);
            border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 30px rgba(0, 229, 255, 0.15) inset, 0 0 20px rgba(0, 102, 255, 0.3);
            z-index: 30; border-radius: 2px;
            transform-origin: center;
        }
        @media (min-width: 768px) { .menu-modal { padding: 25px; width: 360px; } }
        .menu-modal::before, .menu-modal::after {
            content: ''; position: absolute; width: 16px; height: 16px; border-color: var(--cyan); border-style: solid; opacity: 0.8; box-shadow: 0 0 8px var(--cyan);
        }
        .menu-modal::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .menu-modal::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        
        .menu-modal.active { pointer-events: auto; animation: holoUnfold 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .menu-modal.active > * { opacity: 0; animation: holoFadeIn 0.8s ease-out 0.5s forwards; }

        @keyframes holoUnfold {
            0% { transform: scale(1, 0.01); opacity: 0; filter: brightness(3); box-shadow: 0 0 50px #00e5ff inset; }
            30% { transform: scale(1, 0.02); opacity: 1; filter: brightness(2); box-shadow: 0 0 30px #00e5ff inset; }
            70% { transform: scale(1, 1.02); }
            100% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
        }

        @keyframes holoFadeIn {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes sciFiModal {
            0% { opacity: 0; transform: perspective(800px) rotateX(20deg) scale(0.7, 0.01); box-shadow: 0 0 100px var(--cyan) inset; }
            40% { opacity: 1; transform: perspective(800px) rotateX(10deg) scale(1, 0.02); box-shadow: 0 0 50px var(--cyan) inset; }
            70% { transform: perspective(800px) rotateX(-2deg) scale(1, 1.02); }
            100% { opacity: 1; transform: perspective(800px) rotateX(0deg) scale(1, 1); box-shadow: 0 0 40px rgba(0, 229, 255, 0.15) inset, 0 10px 40px rgba(0, 0, 0, 0.9); }
        }

        @keyframes sciFiModalClose {
            0% { opacity: 1; transform: perspective(800px) rotateX(0deg) scale(1, 1); }
            100% { opacity: 0; transform: perspective(800px) rotateX(10deg) scale(0.9, 0.01); box-shadow: 0 0 80px var(--cyan) inset; }
        }

        .animate-open { animation: sciFiModal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-close { animation: sciFiModalClose 0.5s ease-in forwards; }

        .menu-titulo {
            font-family: 'Montserrat', sans-serif; font-weight: 300; border-bottom: 1px dashed rgba(0, 229, 255, 0.3);
            padding-bottom: 10px; margin-bottom: 15px; font-size: 0.85rem; letter-spacing: 0.18em; color: #fff;
            display: flex; justify-content: space-between; align-items: center; text-shadow: 0 0 10px var(--cyan); text-transform: uppercase;
        }
        .menu-enlace {
            display: flex; align-items: center; padding: 12px 12px; cursor: pointer; transition: all 0.3s ease; font-size: 0.75rem; letter-spacing: 0.12em; margin-bottom: 6px; border-bottom: 1px solid transparent; color: rgba(255,255,255,0.85); background: rgba(0, 229, 255, 0.03); pointer-events: auto; min-height: 38px; border-radius: 2px;
        }
        .menu-enlace:hover, .menu-enlace:active {
            color: var(--cyan); background: rgba(0, 229, 255, 0.15); border-bottom: 1px solid var(--cyan); padding-left: 18px; text-shadow: 0 0 8px var(--cyan);
        }
        .menu-enlace .prefix { color: var(--cyan); margin-right: 8px; font-size: 0.65rem; }
        .btn-cerrar {
            margin-top: 18px; padding: 10px; width: 100%; background: transparent; border: 1px solid rgba(0, 229, 255, 0.3); text-align: center; cursor: pointer; font-weight: 300; letter-spacing: 0.2em; transition: all 0.3s ease; color: var(--cyan); font-size: 0.7rem; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        }
        .btn-cerrar:hover, .btn-cerrar:active { background: rgba(0, 229, 255, 0.2); border-color: var(--cyan); }

        .telemetry-data { position: absolute; bottom: 20px; left: 20px; font-size: 0.6rem; color: rgba(0, 229, 255, 0.5); pointer-events: none; letter-spacing: 0.15em; line-height: 1.8; }
        #subtitle-container {
            position: absolute; bottom: 70px; left: 5%; width: 90%; text-align: center; font-size: clamp(0.75rem, 2.5vw, 0.95rem); color: #fff; letter-spacing: 0.08em; opacity: 0; transition: opacity 0.5s ease; text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--blue-neon); pointer-events: none; background: rgba(0, 2, 8, 0.6); padding: 8px 12px; border-radius: 4px; backdrop-filter: blur(4px);
        }
        @media (min-width: 768px) { #subtitle-container { bottom: 40px; left: 15%; width: 70%; padding: 10px; } }
        .cursor-blink { animation: blink 1s step-end infinite; color: var(--cyan); }
        @keyframes blink { 50% { opacity: 0; } }

        .glass-modal {
            background: linear-gradient(135deg, rgba(0, 8, 20, 0.95) 0%, rgba(0, 4, 12, 0.92) 100%);
            backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15) inset, 0 10px 40px rgba(0, 0, 0, 0.9);
            position: relative; max-height: 85vh;
        }
        .glass-modal::before, .glass-modal::after {
            content: ''; position: absolute; width: 30px; height: 30px; border-color: var(--cyan); border-style: solid; opacity: 0.8; box-shadow: 0 0 15px var(--cyan);
        }
        .glass-modal::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .glass-modal::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        
        .sci-fi-card {
            background: rgba(0, 15, 30, 0.4); border: 1px solid rgba(0, 229, 255, 0.15);
            transition: all 0.3s ease;
        }
        .sci-fi-card:hover { border-color: rgba(0, 229, 255, 0.6); box-shadow: 0 0 15px rgba(0, 229, 255, 0.15) inset; transform: translateY(-2px); }
        .sci-fi-img { filter: contrast(1.1) brightness(0.9); transition: all 0.5s ease; }
        .sci-fi-card:hover .sci-fi-img { filter: contrast(1.2) brightness(1.1); transform: scale(1.05); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.6); }

        input, textarea { background: rgba(0, 229, 255, 0.05) !important; border: 1px solid rgba(0, 229, 255, 0.2) !important; color: #fff !important; font-family: 'Share Tech Mono', monospace !important; }
        input:focus, textarea:focus { border-color: var(--cyan) !important; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3) inset !important; outline: none; }

        html[lang="es"] .lang-en { display: none !important; }
        html[lang="en"] .lang-es { display: none !important; }
    </style>
</head>

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let nodes = [], menuNodes = [], backgroundStars = [], distantSuns = [], shootingStars = [], galaxyParticles = [];

        let globalTime = 0, camera = { x: 0, y: 0, zoom: 1, angle: 0 }, targetCamera = { x: 0, y: 0, zoom: 1, angle: 0 };
        let isDragging = false, draggedNode = null, dragStartPos = { x: 0, y: 0 }, activeMenuIndex = -1;
        let typingIntervals = [];

        function screenToWorld(sx, sy) {
            let dx = sx - w / 2, dy = sy - h / 2;
            let cos = Math.cos(-camera.angle), sin = Math.sin(-camera.angle);
            let rx = dx * cos - dy * sin, ry = dx * sin + dy * cos;
            return { x: camera.x + rx / camera.zoom, y: camera.y + ry / camera.zoom };
        }

        function worldToScreen(wx, wy) {
            let dx = (wx - camera.x) * camera.zoom, dy = (wy - camera.y) * camera.zoom;
            let cos = Math.cos(camera.angle), sin = Math.sin(camera.angle);
            let sx = w / 2 + dx * cos - dy * sin, sy = h / 2 + dx * sin + dy * cos;
            return { x: sx, y: sy };
        }

        function resize() {
            w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;

        function iniciarUniversoProfundo() {
            nodes = []; menuNodes = []; backgroundStars = []; distantSuns = []; shootingStars = []; galaxyParticles = [];
            if (activeMenuIndex === -1) { camera.x = targetCamera.x = w / 2; camera.y = targetCamera.y = h / 2; camera.zoom = targetCamera.zoom = 1; camera.angle = targetCamera.angle = 0; }
            
            galaxyCenter = { x: w / 2, y: h / 2 };
            galaxyRadius = Math.max(w, h) * 0.65;
            const gCount = w < 768 ? 1800 : 5000;
            let coreR = galaxyRadius * 0.15;
            
            for (let i = 0; i < gCount; i++) {
                let r, angle, color, size, alpha;
                let speedMult = 1;
                
                if (i < gCount * 0.35) {
                    let u = Math.random(), v = Math.random();
                    r = coreR * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * 0.5; 
                    r = Math.abs(r);
                    angle = Math.random() * Math.PI * 2;
                    let x = Math.cos(angle) * r * 2.2;
                    let y = Math.sin(angle) * r * 0.7;
                    r = Math.hypot(x, y);
                    angle = Math.atan2(y, x);
                    let coreColors = ['#ffffff', '#fff3e0', '#ffe0b2', '#ffcc80'];
                    color = coreColors[Math.floor(Math.random() * coreColors.length)];
                    size = Math.random() * 2.0 + 0.5;
                    alpha = Math.random() * 0.8 + 0.2;
                    speedMult = 1.2;
                } else if (i < gCount * 0.55) {
                    r = Math.random() * galaxyRadius;
                    r = r * Math.random();
                    angle = Math.random() * Math.PI * 2;
                    color = Math.random() > 0.5 ? '#00e5ff' : '#0066ff';
                    size = Math.random() * 1.0 + 0.2;
                    alpha = Math.random() * 0.3 + 0.1;
                    speedMult = 0.5;
                } else {
                    let numArms = 2;
                    let arm = i % numArms;
                    let armOffset = (Math.PI * 2 / numArms) * arm;
                    let d = Math.pow(Math.random(), 1.5); 
                    r = coreR + d * (galaxyRadius - coreR);
                    let winding = 0.35;
                    let theta = Math.log(r / coreR) / winding;
                    let baseAngle = theta + armOffset;
                    let scatterPhase = Math.random() * Math.PI * 2;
                    let scatterAmp = (galaxyRadius * 0.08) + (r * 0.12);
                    let bx = Math.cos(baseAngle) * r;
                    let by = Math.sin(baseAngle) * r;
                    let gauss = (Math.random() + Math.random() + Math.random() - 1.5);
                    bx += Math.cos(scatterPhase) * scatterAmp * gauss;
                    by += Math.sin(scatterPhase) * scatterAmp * gauss;
                    r = Math.hypot(bx, by);
                    angle = Math.atan2(by, bx);
                    let armColors = ['#ffffff', '#00e5ff', '#84ffff', '#0066ff', '#ff4081'];
                    if(Math.random() < 0.03) color = '#ff4081'; 
                    else color = armColors[Math.floor(Math.random() * 4)];
                    size = Math.random() * 1.8 + 0.3;
                    alpha = Math.random() * 0.9 + 0.1;
                }

                galaxyParticles.push({
                    r: r,
                    angle: angle,
                    speed: 0.0006 * speedMult * (coreR / Math.max(r, coreR * 0.3)), 
                    size: size,
                    alpha: alpha,
                    color: color
                });
            }

            for (let i = 0; i < (w < 768 ? 150 : 350); i++) {
                backgroundStars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 0.8 + 0.1, alpha: Math.random() * 0.7 + 0.1, pulseSpeed: Math.random() * 0.02 + 0.005 });
            }

            const numSuns = w < 768 ? 2 : 4;
            for (let i = 0; i < numSuns; i++) {
                distantSuns.push({
                    x: (i + 0.5) * (w / numSuns) + (Math.random() - 0.5) * 80, y: Math.random() * h,
                    radius: (Math.random() * 6 + 12) * (w < 768 ? 0.8 : 1.0),
                    colorInner: i % 2 === 0 ? 'rgba(0, 240, 255, ' : 'rgba(120, 215, 255, ',
                    colorOuter: i % 2 === 0 ? 'rgba(0, 102, 255, ' : 'rgba(150, 0, 255, ',
                    pulse: Math.random() * Math.PI, raysAngle: Math.random() * Math.PI, flareSpeed: Math.random() * 0.003 + 0.002
                });
            }

            const areaFactor = w < 768 ? 3200 : 2500;
            for (let i = 0; i < Math.floor((w * h) / areaFactor); i++) {
                nodes.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, r: Math.random() * 1.0 + 0.3, isNexus: false, alpha: Math.random() * 0.7 + 0.2, pulseRate: Math.random() * 0.04 + 0.01 });
            }

            let marginsX = w < 768 ? w * 0.25 : w * 0.20;
            let marginsY = w < 768 ? h * 0.25 : h * 0.30;

            const nexusPositions = [
                { x: marginsX, y: marginsY }, { x: w - marginsX, y: marginsY }, 
                { x: w - marginsX * 0.8, y: h / 2 }, 
                { x: marginsX, y: h - marginsY }, { x: w - marginsX, y: h - marginsY }
            ];

            nexusPositions.forEach((pos, idx) => {
                let nNode = { x: pos.x, y: pos.y, baseX: pos.x, baseY: pos.y, vx: 0, vy: 0, r: 0, isNexus: true, menuIdx: idx, pulse: Math.random() * Math.PI };
                nodes.push(nNode); menuNodes.push(nNode);
            });
        }

        function drawDetailedSun(ctx, sun) {
            sun.pulse += 0.02; sun.raysAngle += sun.flareSpeed;
            let r = sun.radius * (1 + Math.sin(sun.pulse) * 0.08);
            let gradHalo = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, r * 5);
            gradHalo.addColorStop(0, sun.colorInner + '0.22)'); gradHalo.addColorStop(0.3, sun.colorOuter + '0.08)'); gradHalo.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.beginPath(); ctx.arc(sun.x, sun.y, r * 5, 0, Math.PI * 2); ctx.fillStyle = gradHalo; ctx.fill();

            ctx.save(); ctx.translate(sun.x, sun.y); ctx.rotate(sun.raysAngle);
            for (let i = 0; i < 4; i++) {
                let rayL = (i % 2 === 0) ? r * 6.5 : r * 3.8;
                let rayGrad = ctx.createLinearGradient(-rayL, 0, rayL, 0);
                rayGrad.addColorStop(0, 'rgba(0,0,0,0)'); rayGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)'); rayGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath(); ctx.moveTo(-rayL, 0); ctx.lineTo(rayL, 0); ctx.strokeStyle = rayGrad; ctx.lineWidth = i % 2 === 0 ? 1.2 : 0.8; ctx.stroke(); ctx.rotate(Math.PI / 4);
            }
            ctx.restore();

            let gradCore = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, r);
            gradCore.addColorStop(0, '#ffffff'); gradCore.addColorStop(0.65, sun.colorInner + '0.8)'); gradCore.addColorStop(1, 'transparent');
            ctx.beginPath(); ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2); ctx.fillStyle = gradCore; ctx.fill();
        }

        function drawNexusLightPoint(ctx, x, y, isHovered, isDragged, pulse) {
            ctx.save();
            let isMobile = w < 768;
            let radius = (isHovered || isDragged ? 4.0 : 2.5) * (isMobile ? 1.2 : 1.0);
            let glowRadius = (isHovered || isDragged ? 25 : 15) * (isMobile ? 1.2 : 1.0);
            let pulseScale = Math.max(0.1, 1 + Math.sin(pulse) * 0.2);
            let outerRadius = Math.max(0.1, glowRadius * pulseScale);
            
            let radGlow = ctx.createRadialGradient(x, y, 0, x, y, outerRadius);
            radGlow.addColorStop(0, isDragged ? 'rgba(255, 255, 255, 1)' : 'rgba(0, 229, 255, 0.95)');
            radGlow.addColorStop(0.25, isDragged ? 'rgba(0, 255, 255, 0.5)' : 'rgba(0, 102, 255, 0.35)');
            radGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath(); ctx.arc(x, y, outerRadius, 0, Math.PI * 2); ctx.fillStyle = radGlow; ctx.fill();
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.shadowBlur = 12; ctx.shadowColor = "#00e5ff"; ctx.fill();
            ctx.restore();
        }

        function drawConstellations(ctx) {
            ctx.save();
            let scaleFactor = w < 768 ? 1.4 : 1.8;
            const lang = getCurrentLang();
            let hitRadius = w < 768 ? 55 : 45;

            menuNodes.forEach(n => {
                let isHovered = Math.hypot(n.x - pointer.x, n.y - pointer.y) < hitRadius;
                let isMoving = (isDragging && draggedNode === n);
                let isSelected = (activeMenuIndex === n.menuIdx);
                let isHighlighted = isMoving || isSelected || isHovered;
                let alpha = isHighlighted ? 1 : 0.3; 
                
                const z = zodiacs[n.menuIdx];
                ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`; ctx.lineWidth = isHighlighted ? 1.5 : 0.8; ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                
                ctx.beginPath();
                for(let i = 0; i < z.length; i++) {
                    let px = n.x + z[i].x * scaleFactor, py = n.y + z[i].y * scaleFactor;
                    ctx.moveTo(px + 2, py); ctx.arc(px, py, isHighlighted ? 2.5 : 1.5, 0, Math.PI*2);
                    if(i > 0) { ctx.moveTo(n.x + z[i-1].x * scaleFactor, n.y + z[i-1].y * scaleFactor); ctx.lineTo(px, py); }
                }
                ctx.stroke(); ctx.fill();
                
                ctx.font = isHighlighted ? "bold 15px 'Share Tech Mono'" : "13px 'Share Tech Mono'";

        function dibujar() {
            camera.x += (targetCamera.x - camera.x) * 0.1; 
            camera.y += (targetCamera.y - camera.y) * 0.1;
            camera.zoom += (targetCamera.zoom - camera.zoom) * 0.1; 
            camera.angle += (targetCamera.angle - camera.angle) * 0.1;

            if (Math.abs(targetCamera.x - camera.x) < 0.1) camera.x = targetCamera.x;
            if (Math.abs(targetCamera.y - camera.y) < 0.1) camera.y = targetCamera.y;
            if (Math.abs(targetCamera.zoom - camera.zoom) < 0.001) camera.zoom = targetCamera.zoom;
            if (Math.abs(targetCamera.angle - camera.angle) < 0.001) camera.angle = targetCamera.angle;

            ctx.clearRect(0, 0, w, h);
            globalTime += 1;

            if (Math.random() < 0.015) {
                let startX = Math.random() * (w * 1.5) - w * 0.25, startY = Math.random() * (h * 0.5) - h * 0.2;
                let angle = Math.PI / 4 + (Math.random() - 0.5) * 0.2, speed = Math.random() * 8 + 12;
                shootingStars.push({ x: startX, y: startY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, length: Math.random() * 80 + 100, alpha: 1.0, decay: Math.random() * 0.015 + 0.01 });
            }

            ctx.save(); ctx.translate(w / 2, h / 2); ctx.scale(camera.zoom, camera.zoom); ctx.rotate(camera.angle); ctx.translate(-camera.x, -camera.y);

            distantSuns.forEach(sun => drawDetailedSun(ctx, sun));
            backgroundStars.forEach(star => {
                star.alpha += Math.sin(globalTime * star.pulseSpeed) * 0.01;
                if (star.alpha < 0.1) star.alpha = 0.1; if (star.alpha > 0.8) star.alpha = 0.8;
                ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(180, 230, 255, ${star.alpha})`; ctx.fill();
            });

            ctx.save();
            ctx.translate(galaxyCenter.x, galaxyCenter.y);
            ctx.rotate(0.4); 
            ctx.scale(1, 0.40); 
            ctx.globalCompositeOperation = 'lighter';
            
            let haloR = galaxyRadius * 0.45;
            let coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
            coreGrad.addColorStop(0, 'rgba(255, 240, 220, 0.35)');
            coreGrad.addColorStop(0.2, 'rgba(255, 180, 100, 0.15)');
            coreGrad.addColorStop(0.5, 'rgba(0, 150, 255, 0.05)');
            coreGrad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, haloR, 0, Math.PI * 2);
            ctx.fill();

            galaxyParticles.forEach(p => {
                p.angle += p.speed; 
                let x = Math.cos(p.angle) * p.r; 
                let y = Math.sin(p.angle) * p.r; 
                let distFade = Math.max(0, 1 - (p.r / (galaxyRadius * 1.1))); 
                ctx.globalAlpha = p.alpha * distFade;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                ss.x += ss.vx; ss.y += ss.vy; ss.alpha -= ss.decay;
                if (ss.alpha <= 0) { shootingStars.splice(i, 1); continue; }
                let tailX = ss.x - (ss.vx / 10) * ss.length, tailY = ss.y - (ss.vy / 10) * ss.length;
                let gradSS = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                gradSS.addColorStop(0, `rgba(255, 255, 255, ${ss.alpha})`); gradSS.addColorStop(0.3, `rgba(0, 229, 255, ${ss.alpha * 0.7})`); gradSS.addColorStop(1, 'transparent');
                ctx.beginPath(); ctx.moveTo(ss.x, ss.y); ctx.lineTo(tailX, tailY); ctx.strokeStyle = gradSS; ctx.lineWidth = 2.0; ctx.stroke();
            }

            drawConstellations(ctx);
            ctx.globalCompositeOperation = 'lighter';
            const connectionDistance = w < 768 ? 65 : 85; 

            for (let i = 0; i < nodes.length; i++) {
                let n1 = nodes[i];
                if(!n1.isNexus) {
                    n1.x += n1.vx; n1.y += n1.vy;
                    if(n1.x < 0) n1.x = w; if(n1.x > w) n1.x = 0;
                    if(n1.y < 0) n1.y = h; if(n1.y > h) n1.y = 0;
                    n1.alpha = 0.4 + Math.sin(globalTime * n1.pulseRate) * 0.4;
                } else {
                    n1.pulse += 0.03;
                    if (draggedNode !== n1) {
                        let dx = pointer.x - n1.x, dy = pointer.y - n1.y, dist = Math.hypot(dx, dy);
                        if (dist < 120 && dist > 0.001 && !isDragging) {
                            let force = (120 - dist) / 120; n1.vx -= (dx / dist) * force * 0.8; n1.vy -= (dy / dist) * force * 0.8;
                        }
                        n1.vx += (n1.baseX - n1.x) * 0.03; n1.vy += (n1.baseY - n1.y) * 0.03;
                        n1.vx *= 0.85; n1.vy *= 0.85; n1.x += n1.vx; n1.y += n1.vy;
                    }
                }

                if (n1.isNexus) {
                    let hitRadius = w < 768 ? 55 : 45;
                    drawNexusLightPoint(ctx, n1.x, n1.y, Math.hypot(n1.x - pointer.x, n1.y - pointer.y) < hitRadius, draggedNode === n1, n1.pulse);
                } else {
                    ctx.beginPath(); ctx.arc(n1.x, n1.y, n1.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(0, 150, 255, ${n1.alpha})`; ctx.fill();
                }

                for (let j = i + 1; j < nodes.length; j++) {
                    let n2 = nodes[j];
                    if (Math.abs(n1.x - n2.x) > connectionDistance || Math.abs(n1.y - n2.y) > connectionDistance) continue;
                    let dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
                    if (dist < connectionDistance) { 
                        ctx.beginPath(); ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y);
                        let op = (1 - dist/connectionDistance);

                        ctx.lineWidth = (n1.isNexus || n2.isNexus) ? 0.8 : 0.4; ctx.stroke();
                    }
                }
            }
            ctx.restore();

            if (activeMenuIndex !== -1) posicionarMenuSobreNodo(activeMenuIndex);
            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(dibujar);
        }

        window.addEventListener('resize', resize); resize();

        function updatePointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            pointer.screenX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            pointer.screenY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            let worldP = screenToWorld(pointer.screenX, pointer.screenY);
            pointer.x = worldP.x; pointer.y = worldP.y;

        function handlePointerStart(e) {

                document.getElementById('contact-modal').classList.contains('opacity-100')) {
                return;
            }
            updatePointerPos(e); dragStartPos = { x: pointer.x, y: pointer.y };
            let hitRadius = w < 768 ? 60 : 50;
            menuNodes.forEach(n => { if (Math.hypot(n.x - pointer.x, n.y - pointer.y) < hitRadius) { isDragging = true; draggedNode = n; } });
        }

        function handlePointerMove(e) {
            if (document.getElementById('info-modal').classList.contains('opacity-100') ||
                document.getElementById('contact-modal').classList.contains('opacity-100')) {
                return;
            }
            updatePointerPos(e);
            if (isDragging && draggedNode) {
                draggedNode.baseX = pointer.x; draggedNode.baseY = pointer.y; draggedNode.x = pointer.x; draggedNode.y = pointer.y; canvas.style.cursor = 'grabbing';
            } else {
                let hover = false, hitRadius = w < 768 ? 55 : 45;
                menuNodes.forEach(n => { if (Math.hypot(n.x - pointer.x, n.y - pointer.y) < hitRadius) hover = true; });
                canvas.style.cursor = hover ? 'grab' : 'crosshair';
            }
        }

        function handlePointerEnd() {
            if (isDragging && draggedNode) {
                if (Math.hypot(pointer.x - dragStartPos.x, pointer.y - dragStartPos.y) < 12) abrirMenu(draggedNode.menuIdx);
                isDragging = false; draggedNode = null; canvas.style.cursor = 'grab';
            }
        }

        canvas.addEventListener('mousedown', handlePointerStart); canvas.addEventListener('mousemove', handlePointerMove); canvas.addEventListener('mouseup', handlePointerEnd);
        canvas.addEventListener('mouseleave', () => { pointer.x = -1000; pointer.y = -1000; isDragging = false; draggedNode = null; });
        canvas.addEventListener('touchstart', (e) => { handlePointerStart(e); }, { passive: false });

        const panelMenu = document.getElementById('panel-menu');
        const tituloMenuText = document.getElementById('menu-title-text');

        function iniciarSistema() {

                document.getElementById('start-screen').style.display = 'none';

            }, 2000);
            setInterval(() => { document.getElementById('telemetry-1').innerText = (99.90 + Math.random() * 0.09).toFixed(3); }, 800);
            dibujar();
        }

        function posicionarMenuSobreNodo(index) {
            const node = menuNodes[index];
            if (!node) return;
            let screenP = worldToScreen(node.x, node.y);
            const menuWidth = panelMenu.offsetWidth || 320, menuHeight = panelMenu.offsetHeight || 300;
            
            let left, top = screenP.y - menuHeight / 2;
            
            if (node.baseX > w / 2) {
                left = screenP.x - menuWidth - 35;
                panelMenu.style.transformOrigin = "right center";
            } else {
                left = screenP.x + 35;
                panelMenu.style.transformOrigin = "left center";
            }
            
            if (left < 15) left = 15;
            if (left + menuWidth > w - 15) left = w - menuWidth - 15;
            if (top < 20) top = 20; 
            if (top + menuHeight > h - 20) top = h - menuHeight - 20;
            
            panelMenu.style.left = `${Math.round(left)}px`; 
            panelMenu.style.top = `${Math.round(top)}px`;
        }

        function animarMenuEnlaces(enlacesConfig) {
            const contenedor = document.getElementById('menu-enlaces');
            contenedor.innerHTML = '';
            typingIntervals.forEach(clearTimeout); typingIntervals = [];
            const lang = getCurrentLang();

            enlacesConfig.forEach((link, idx) => {
                let div = document.createElement('div');
                div.className = 'menu-enlace';
                div.onclick = link.action;
                
                let prefix = document.createElement('span'); prefix.className = 'prefix'; prefix.innerText = '>';
                div.appendChild(prefix);
                
                let textSpan = document.createElement('span'); div.appendChild(textSpan);
                contenedor.appendChild(div);

                let textToType = lang === 'es' ? link.textEs : link.textEn;
                let startDelay = idx * 150, i = 0;
                function teclearEnlace() {
                    if (i < textToType.length) { textSpan.innerHTML += textToType.charAt(i); i++; typingIntervals.push(setTimeout(teclearEnlace, 20)); }
                }
                typingIntervals.push(setTimeout(teclearEnlace, startDelay));
            });
        }

        function abrirMenu(index) {
            playDigitalChime(true); activeMenuIndex = index;
            const info = configuracionMenus[index]; const node = menuNodes[index];
            
            if (node) {
                targetCamera.x = node.x;
                targetCamera.y = node.y;
                targetCamera.zoom = w < 768 ? 1.2 : 1.4;
                targetCamera.angle = (index % 2 === 0 ? 1 : -1) * 0.12;
            }
            
            tituloMenuText.innerText = info.nombre[getCurrentLang()];
            animarMenuEnlaces(info.links);
            posicionarMenuSobreNodo(index); panelMenu.classList.add('active');
            reproducirVozCinematica(info.voz);
        }

        function cerrarMenu() {
            playDigitalChime(false); activeMenuIndex = -1; panelMenu.classList.remove('active');
            
            targetCamera.x = w / 2; 
            targetCamera.y = h / 2; 
            targetCamera.zoom = 1; 
            targetCamera.angle = 0;
            
            typingIntervals.forEach(clearTimeout); typingIntervals = [];
            window.speechSynthesis.cancel(); clearTimeout(typeTimeoutSub);
            document.getElementById('subtitle-container').style.opacity = 0;
        }

    </script>
</body>
</html>
