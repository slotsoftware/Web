    <style>
        :root {
            --cyan: #00f3ff;
            --blue: #0066ff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #010a14 0%, #000205 75%, #000000 100%); 
            color: #ffffff; 
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        /* Canvas Background */
        #space-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            pointer-events: none; /* Let clicks pass through to UI */
        }
        
        /* Scanlines Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.25) 51%);
            background-size: 100% 4px; pointer-events: none; opacity: 0.3;
        }

        /* Overlay UI */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column;
            pointer-events: none; /* Only children are clickable */
        }

        .clickable { pointer-events: auto; }

        /* Contenedor Principal (Panel de datos) */
        #main-viewer {
            transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .viewer-hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            pointer-events: none;
        }

        .viewer-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Glassmorphism */
        .glass-panel {
            background: linear-gradient(135deg, rgba(3, 11, 20, 0.85) 0%, rgba(10, 25, 47, 0.75) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .glass-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 15px; height: 15px;
            border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
        }
        .glass-panel::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 15px; height: 15px;
            border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan);
        }

        /* Neon Text */
        .text-neon {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 102, 255, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        /* Start Screen */
        #start-screen {
            position: fixed; inset: 0; z-index: 50;
            background: #000000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 2s ease-in-out;
        }

        .btn-boot {
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            text-transform: uppercase; letter-spacing: 0.2em;
            padding: 1rem 2.5rem;
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0, 102, 255, 0.3);
        }
        .btn-boot:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.4), 0 0 20px rgba(0, 102, 255, 0.6);
            transform: scale(1.05);
        }

        /* Estilo Prometheus para los Títulos */
        .prometheus-style {
            font-family: 'Montserrat', sans-serif;
            font-weight: 100;
            letter-spacing: 0.65em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.8), 0 0 40px rgba(0, 102, 255, 0.6), 0 0 80px rgba(0, 243, 255, 0.4);
            margin-right: -0.65em; /* Compensar letter spacing al centro */
        }

        /* Fondo de Prometheus (Flotante) */
        #idle-title {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5; /* Detrás de la UI, delante del canvas */
            pointer-events: none;
            text-align: center;
            transition: opacity 1.5s ease-in-out;
            opacity: 0; /* Oculto hasta que arranca el sistema */
        }
        
        #idle-title.visible { opacity: 1; }

        /* Nav Item Styles */
        .nav-item {
            transition: all 0.3s ease;
            border-left: 2px solid transparent;
        }
        .nav-item.active {
            background: rgba(0, 243, 255, 0.15);
            border-left: 2px solid var(--cyan);
            color: var(--cyan);
            box-shadow: inset 20px 0 20px -20px rgba(0, 243, 255, 0.5);
        }
        .nav-item:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            border-left: 2px solid rgba(0, 243, 255, 0.5);
        }

        /* Image Hover FX */
        .sci-fi-img-container { overflow: hidden; position: relative; border: 1px solid rgba(0, 243, 255, 0.2); }
        .sci-fi-img-container img { transition: transform 0.7s ease, filter 0.3s ease; filter: grayscale(20%) brightness(0.8); }

        .sci-fi-img-container::after {
            content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 102, 255, 0.4), transparent); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;

        function iniciarUniversoProfundo() {
            backgroundStars = []; distantSuns = []; galaxyParticles = [];
            
            galaxyCenter = { x: w / 2, y: h / 2 };
            galaxyRadius = Math.max(w, h) * 0.65;

                    r = coreR * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * 0.5;

                    angle = Math.random() * Math.PI * 2;
                    let x = Math.cos(angle) * r * 2.2;
                    let y = Math.sin(angle) * r * 0.7;
                    r = Math.hypot(x, y);
                    angle = Math.atan2(y, x);
                    let coreColors = ['#ffffff', '#fff3e0', '#ffe0b2', '#ffcc80'];
                    color = coreColors[Math.floor(Math.random() * coreColors.length)];
                    size = (Math.random() * 1.5 + 0.5) * 0.6; // Más pequeñas
                    alpha = Math.random() * 0.8 + 0.2;
                    speedMult = 1.0;
                } else if (i < gCount * 0.55) {

                    r = Math.random() * galaxyRadius;
                    r = r * Math.random();
                    angle = Math.random() * Math.PI * 2;
                    color = Math.random() > 0.5 ? '#00e5ff' : '#0066ff';
                    size = (Math.random() * 0.8 + 0.2) * 0.6; // Más pequeñas
                    alpha = Math.random() * 0.3 + 0.1;
                    speedMult = 0.4;

                    let numArms = 2;
                    let arm = i % numArms;
                    let armOffset = (Math.PI * 2 / numArms) * arm;
                    let d = Math.pow(Math.random(), 1.5); 
                    r = coreR + d * (galaxyRadius - coreR);
                    let winding = 0.35;
                    let theta = Math.log(r / coreR) / winding;
                    let baseAngle = theta + armOffset;
                    let scatterPhase = Math.random() * Math.PI * 2;
                    let scatterAmp = (galaxyRadius * 0.08) + (r * 0.12);
                    let bx = Math.cos(baseAngle) * r;
                    let by = Math.sin(baseAngle) * r;
                    let gauss = (Math.random() + Math.random() + Math.random() - 1.5);
                    bx += Math.cos(scatterPhase) * scatterAmp * gauss;
                    by += Math.sin(scatterPhase) * scatterAmp * gauss;
                    r = Math.hypot(bx, by);
                    angle = Math.atan2(by, bx);
                    let armColors = ['#ffffff', '#00e5ff', '#84ffff', '#0066ff', '#ff4081'];
                    if(Math.random() < 0.03) color = '#ff4081'; 
                    else color = armColors[Math.floor(Math.random() * 4)];
                    size = (Math.random() * 1.5 + 0.3) * 0.6; // Más pequeñas
                    alpha = Math.random() * 0.9 + 0.1;
                    speedMult = 0.8;
                }

                galaxyParticles.push({
                    r: r,
                    angle: angle,
                    // Reducimos enormemente la velocidad
                    speed: 0.00015 * speedMult * (coreR / Math.max(r, coreR * 0.3)), 
                    size: size,
                    alpha: alpha,
                    color: color
                });
            }

            // 2. Estrellas de fondo parpadeantes (Más pequeñas)
            for (let i = 0; i < (w < 768 ? 200 : 400); i++) {
                backgroundStars.push({ 
                    x: Math.random() * w, y: Math.random() * h, 
                    r: (Math.random() * 0.6 + 0.1), // Mucho más pequeñas
                    alpha: Math.random() * 0.7 + 0.1, 
                    pulseSpeed: Math.random() * 0.015 + 0.002 // Pulsación más lenta
                });
            }

            // 3. Soles Distantes (Menos y más pequeños)
            const numSuns = w < 768 ? 2 : 3;
            for (let i = 0; i < numSuns; i++) {
                distantSuns.push({
                    x: (i + 0.5) * (w / numSuns) + (Math.random() - 0.5) * 80, 
                    y: Math.random() * h,
                    radius: (Math.random() * 4 + 8) * (w < 768 ? 0.8 : 1.0), // Radio reducido
                    colorInner: i % 2 === 0 ? 'rgba(0, 240, 255, ' : 'rgba(120, 215, 255, ',
                    colorOuter: i % 2 === 0 ? 'rgba(0, 102, 255, ' : 'rgba(150, 0, 255, ',
                    pulse: Math.random() * Math.PI, 
                    raysAngle: Math.random() * Math.PI, 
                    flareSpeed: Math.random() * 0.001 + 0.001 // Destellos más lentos
                });
            }
        }

        function drawDetailedSun(ctx, sun) {
            sun.pulse += 0.01; sun.raysAngle += sun.flareSpeed;
            let r = sun.radius * (1 + Math.sin(sun.pulse) * 0.08);
            
            // Halo grande muy sutil
            let gradHalo = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, r * 5);
            gradHalo.addColorStop(0, sun.colorInner + '0.15)'); 
            gradHalo.addColorStop(0.3, sun.colorOuter + '0.05)'); 
            gradHalo.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.beginPath(); ctx.arc(sun.x, sun.y, r * 5, 0, Math.PI * 2); ctx.fillStyle = gradHalo; ctx.fill();

            // Rayos
            ctx.save(); ctx.translate(sun.x, sun.y); ctx.rotate(sun.raysAngle);
            for (let i = 0; i < 4; i++) {
                let rayL = (i % 2 === 0) ? r * 5 : r * 2.5;
                let rayGrad = ctx.createLinearGradient(-rayL, 0, rayL, 0);
                rayGrad.addColorStop(0, 'rgba(0,0,0,0)'); rayGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)'); rayGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath(); ctx.moveTo(-rayL, 0); ctx.lineTo(rayL, 0); ctx.strokeStyle = rayGrad; ctx.lineWidth = i % 2 === 0 ? 0.8 : 0.4; ctx.stroke(); ctx.rotate(Math.PI / 4);
            }
            ctx.restore();

            // Núcleo
            let gradCore = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, r);
            gradCore.addColorStop(0, '#ffffff'); gradCore.addColorStop(0.6, sun.colorInner + '0.6)'); gradCore.addColorStop(1, 'transparent');
            ctx.beginPath(); ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2); ctx.fillStyle = gradCore; ctx.fill();
        }

        function drawSpace() {
            ctx.clearRect(0, 0, w, h);
            globalTime += 1;
            
            // Suavizado del movimiento del ratón
            mouseX += (targetMouseX - mouseX) * 0.03;
            mouseY += (targetMouseY - mouseY) * 0.03;

            // 1. Dibujar Soles
            distantSuns.forEach(sun => {
                // Parallax sutil basado en ratón
                let sx = sun.x + (mouseX * 10);
                let sy = sun.y + (mouseY * 10);
                // Guardar original temporalmente
                let ox = sun.x; let oy = sun.y;
                sun.x = sx; sun.y = sy;
                drawDetailedSun(ctx, sun);
                sun.x = ox; sun.y = oy;
            });

            // 2. Dibujar Estrellas de Fondo
            backgroundStars.forEach(star => {
                star.alpha += Math.sin(globalTime * star.pulseSpeed) * 0.01;
                if (star.alpha < 0.1) star.alpha = 0.1; if (star.alpha > 0.8) star.alpha = 0.8;
                
                let px = star.x + (mouseX * 20 * star.r); // Parallax según tamaño
                let py = star.y + (mouseY * 20 * star.r);
                
                ctx.beginPath(); 
                ctx.arc(px, py, star.r, 0, Math.PI * 2); 
                ctx.fillStyle = `rgba(180, 230, 255, ${star.alpha})`; 
                ctx.fill();
            });

            // 3. Dibujar Galaxia Central
            ctx.save();
            // El centro se mueve ligeramente con el ratón
            let cx = galaxyCenter.x + (mouseX * 15);
            let cy = galaxyCenter.y + (mouseY * 15);
            
            ctx.translate(cx, cy);
            ctx.rotate(0.3); // Inclinación estática
            ctx.scale(1, 0.45); // Forma elíptica de galaxia
            
            ctx.globalCompositeOperation = 'lighter';
            
            // Resplandor del núcleo galáctico
            let haloR = galaxyRadius * 0.4;
            let coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
            coreGrad.addColorStop(0, 'rgba(255, 240, 220, 0.25)');
            coreGrad.addColorStop(0.2, 'rgba(255, 180, 100, 0.1)');
            coreGrad.addColorStop(0.5, 'rgba(0, 150, 255, 0.03)');
            coreGrad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, haloR, 0, Math.PI * 2);
            ctx.fill();

            // Partículas de la espiral
            galaxyParticles.forEach(p => {
                p.angle += p.speed; // Rotación super lenta
                let x = Math.cos(p.angle) * p.r; 
                let y = Math.sin(p.angle) * p.r; 
                let distFade = Math.max(0, 1 - (p.r / (galaxyRadius * 1.1))); 
                
                ctx.globalAlpha = p.alpha * distFade;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
            
            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(drawSpace);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX / w) * 2 - 1;
            targetMouseY = (e.clientY / h) * 2 - 1;
        });

        function toggleLanguage() {
            const html = document.documentElement;
            const currentLang = html.getAttribute('lang') || 'es';
            const newLang = currentLang === 'es' ? 'en' : 'es';
            html.setAttribute('lang', newLang);
            playBeep();
            
            buildNav();
            if (currentActiveId) loadContent(currentActiveId);
        }

        function getCurrentLang() {
            return document.documentElement.getAttribute('lang') || 'es';
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('icon-audio');
            if (audioEnabled) {
                bgAudioElement.play().catch(e => console.log("Auto-play blocked"));
                icon.setAttribute('data-lucide', 'volume-2');
            } else {
                bgAudioElement.pause();
                icon.setAttribute('data-lucide', 'volume-x');
            }
            lucide.createIcons();
        }

        function playBeep() {
            if(!audioEnabled) return;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function reproducirVoz(textoObj) {
            if(!audioEnabled) return;
            clearTimeout(typeTimeoutSub);
            window.speechSynthesis.cancel();
            
            const lang = getCurrentLang();
            const texto = textoObj[lang];
            const subtitleText = document.getElementById('subtitle-text');
            subtitleText.innerHTML = "";
            
            let msg = new SpeechSynthesisUtterance(texto);
            msg.lang = lang === 'en' ? 'en-US' : 'es-ES';
            msg.pitch = 0.9; msg.rate = 1.1; 
            
            let i = 0;
            function teclear() {
                if (i < texto.length) {
                    subtitleText.innerHTML += texto.charAt(i); i++;
                    typeTimeoutSub = setTimeout(teclear, 30); 
                }
            }
            teclear();
            window.speechSynthesis.speak(msg);
        }

        function buildNav() {
            const container = document.getElementById('nav-container');
            const lang = getCurrentLang();
            container.innerHTML = '';
            
            navConfig.forEach(item => {
                const data = db[item.id];
                const btn = document.createElement('button');
                // Si el item no es el activo, marcamos su borde para mantener el espaciado correcto
                let borderClass = currentActiveId === item.id ? 'active' : 'border-l-2 border-transparent';
                
                btn.className = `nav-item flex items-center justify-center md:justify-start gap-3 p-4 md:p-5 w-full text-left font-title text-sm md:text-base tracking-widest text-gray-300 ${borderClass}`;
                
                // Botón clickeado -> mostramos visor y cargamos
                btn.onclick = () => {
                    openViewer();
                    loadContent(item.id);
                };
                
                btn.innerHTML = `
                    <i data-lucide="${data.icon}" class="w-5 h-5 flex-shrink-0"></i>
                    <span class="hidden md:block whitespace-nowrap">${item.label[lang]}</span>
                `;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function loadContent(id) {
            playBeep();
            currentActiveId = id;
            buildNav(); // update active state
            
            const data = db[id];
            const lang = getCurrentLang();
            
            // Set Header
            document.getElementById('content-title').innerText = data.title[lang];
            document.getElementById('content-icon').setAttribute('data-lucide', data.icon);
            lucide.createIcons();
            
            // Ocultamos título idle
            document.getElementById('idle-title').classList.remove('visible');
            
            // Animamos entrada del texto
            const body = document.getElementById('content-body');
            body.innerHTML = '';
            setTimeout(() => {
                body.innerHTML = data.content[lang];
            }, 50); // Ligero delay para repintar
            
            
            // Voice & Subtitles
            if (data.voice) reproducirVoz(data.voice);
        }

        function openViewer() {
            const viewer = document.getElementById('main-viewer');
            viewer.classList.remove('viewer-hidden');
            viewer.classList.add('viewer-visible');
            
            // Ocultar el título de fondo
            document.getElementById('idle-title').classList.remove('visible');
        }

        function closeViewer() {
            playBeep();
            currentActiveId = null;
            buildNav(); // quita seleccionados
            
            // Ocultar cristal principal
            const viewer = document.getElementById('main-viewer');
            viewer.classList.remove('viewer-visible');
            viewer.classList.add('viewer-hidden');
            
            // Mostrar título de fondo
            document.getElementById('idle-title').classList.add('visible');
            
            // Reset voz
            window.speechSynthesis.cancel();
            document.getElementById('subtitle-text').innerHTML = "";
            clearTimeout(typeTimeoutSub);
        }

        function bootSystem() {
            if(audioEnabled) {
                bgAudioElement.play().catch(e => console.log("Audio play blocked"));
                playBeep();
            }
            
            // Iniciar canvas
            resize();
            drawSpace();

            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('ui-layer').classList.remove('opacity-0');
                
                // Mostrar título estilo Prometheus flotando en el fondo
                document.getElementById('idle-title').classList.add('visible');
                
                buildNav();
                reproducirVoz({es: "Enlace digital establecido. Seleccione módulo en la barra de navegación.", en: "Digital link established. Select module in the navigation bar."});
            }, 1500);

            // Fake telemetry
            setInterval(() => { 
                document.getElementById('telemetry-sys').innerText = (99.90 + Math.random() * 0.09).toFixed(3); 
            }, 800);
        }
    </script>
</body>
</html>
