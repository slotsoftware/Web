<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dark: '#020617', card: '#0f172a' },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        .bg-grid {
            position: fixed; inset: 0; z-index: -1; background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        .glow-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: -1; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .news-card { animation: slideInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; transition: all 0.3s ease; }
        .news-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); box-shadow: 0 10px 40px -10px rgba(59, 130, 246, 0.3); }

        @keyframes heartBurst { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
        .heart-active i { animation: heartBurst 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .comments-section { transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .comments-section.open { max-height: 800px; opacity: 1; overflow-y: auto; }
    </style>
</head>

        <i id="toast-icon" data-lucide="info" class="w-5 h-5"></i>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD42jUfZAHQxgB_sufnWFjpNbkyxeQq640",
            authDomain: "slotsoftware-98893.firebaseapp.com",
            projectId: "slotsoftware-98893",
            storageBucket: "slotsoftware-98893.firebasestorage.app",
            messagingSenderId: "758147068859",
            appId: "1:758147068859:web:471b9bd137d2b0baedca9e",
            measurementId: "G-QP0Y1GEXCC"
        };

        let allNews = [];
        let currentFilter = 'KRONO PERSONAL'; 
        let isAdmin = false;
        let db = null;
        let auth = null;
        let currentUserUid = null;
        let userNickname = localStorage.getItem('slot_nickname') || null; 
        let pendingCommentNewsId = null; 
        let openComments = new Set(); 
        let pendingDeleteAction = null;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'krono') {
            isAdmin = true;
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('admin-badge').classList.remove('hidden');
            document.getElementById('admin-badge').classList.add('flex');
        }

        window.showToast = function(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.innerText = message;
            if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toast.className = "fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-900 text-green-400 px-6 py-3 rounded-full shadow-[0_0_30px_rgba(74,222,128,0.2)] text-sm font-bold transition-all duration-300 opacity-100 translate-y-0 pointer-events-none z-[100] flex items-center gap-3 border border-green-500/30";
            } else {
                toastIcon.setAttribute('data-lucide', 'alert-octagon');
                toast.className = "fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-900 text-red-400 px-6 py-3 rounded-full shadow-[0_0_30px_rgba(248,113,113,0.2)] text-sm font-bold transition-all duration-300 opacity-100 translate-y-0 pointer-events-none z-[100] flex items-center gap-3 border border-red-500/30";
            }
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function askConfirmDialog(actionCallback) {
            pendingDeleteAction = actionCallback;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }
        document.getElementById('btn-cancel-delete').addEventListener('click', () => {
            document.getElementById('confirm-modal').classList.add('hidden');
        });
        document.getElementById('btn-confirm-delete').addEventListener('click', () => {
            if (pendingDeleteAction) pendingDeleteAction();
            document.getElementById('confirm-modal').classList.add('hidden');
        });

        window.setFilter = function(category) {
            currentFilter = category;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                let buttonText = btn.innerText.toUpperCase();
                let isMatch = false;

                if (category === 'KRONO PERSONAL' && buttonText === 'KRONO PERSONAL') isMatch = true;
                else if (category === 'KRONO DUAL' && buttonText === 'KRONO DUAL') isMatch = true;
                else if (category === 'TELEMETRY' && buttonText === 'TELEMETRY') isMatch = true;
                else if (category === 'FUTURAS APLICACIONES' && buttonText === 'FUTURAS APLICACIONES') isMatch = true;

                if (isMatch) {
                    btn.className = 'filter-btn active px-4 py-2 rounded-xl text-sm font-bold bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-lg transition-all';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all';
                }
            });
            renderNews();
        };

        function formatDate(timestamp) {
            if (!timestamp) return 'AHORA MISMO';
            const date = new Date(timestamp);
            return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' }).toUpperCase();
        }

        function getCategoryStyle(category) {
            const cat = (category || '').toUpperCase();
            if (cat.includes('KRONO PERSONAL')) return 'bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 shadow-[0_0_15px_rgba(52,211,153,0.4)]';
            if (cat.includes('KRONO DUAL')) return 'bg-gradient-to-r from-fuchsia-500 to-pink-500 text-white shadow-[0_0_15px_rgba(217,70,239,0.4)]';
            if (cat.includes('TELEMETRY')) return 'bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 shadow-[0_0_15px_rgba(34,211,238,0.4)]';
            if (cat.includes('FUTURAS APLICACIONES')) return 'bg-gradient-to-r from-orange-400 to-amber-500 text-slate-950 shadow-[0_0_15px_rgba(251,146,60,0.4)]';
            return 'bg-gradient-to-r from-slate-300 to-slate-500 text-slate-950 shadow-lg';
        }

        window.renderNews = function() {
            const container = document.getElementById('feed-container');
            const loadingState = document.getElementById('loading-state');
            const emptyState = document.getElementById('empty-state');
            
            if(loadingState) loadingState.style.display = 'none';

            const existingCards = container.querySelectorAll('.news-card-el');
            existingCards.forEach(card => card.remove());

            // AHORA FILTRA DETECTANDO SI CONTIENE LA PALABRA BASE, SIN IMPORTAR LA VERSIÓN QUE PONGAS
            let filteredNews = allNews.filter(n => {
                if (!n.category) return false;
                return n.category.toUpperCase().includes(currentFilter);
            });

            if (filteredNews.length === 0) {
                if(emptyState) emptyState.style.display = 'flex';
                return;
            } else {
                if(emptyState) emptyState.style.display = 'none';
            }

            filteredNews.forEach((news) => {
                const card = document.createElement('div');
                card.className = `news-card-el news-card glass-panel rounded-2xl p-6 flex flex-col gap-4 relative overflow-hidden`;
                
                const glow = document.createElement('div');
                glow.className = 'absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-transparent via-white/20 to-transparent opacity-50';
                card.appendChild(glow);

                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-1';
                
                const badge = document.createElement('span');
                badge.className = `text-[10px] font-extrabold px-3 py-1.5 rounded-lg tracking-widest uppercase border border-white/20 ${getCategoryStyle(news.category)}`;
                badge.innerText = news.category;
                
                const dateText = document.createElement('div');
                dateText.className = 'flex items-center gap-1.5 text-xs text-slate-400 font-bold tracking-wider';
                dateText.innerHTML = `<i data-lucide="clock" class="w-3.5 h-3.5"></i> ${formatDate(news.timestamp)}`;

                header.appendChild(badge);
                header.appendChild(dateText);
                card.appendChild(header);

                const text = document.createElement('p');
                text.className = 'text-[15px] text-slate-100 font-medium leading-relaxed whitespace-pre-wrap';
                text.innerText = news.text;
                card.appendChild(text);

                if (news.mediaUrl) {
                    const mediaContainer = document.createElement('div');
                    mediaContainer.className = 'relative mt-2 rounded-xl overflow-hidden border border-white/10 shadow-[0_8px_30px_rgba(0,0,0,0.4)] group bg-slate-900';
                    const ytMatch = news.mediaUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                    const videoMatch = news.mediaUrl.match(/\.(mp4|webm|ogg)$/i);
                    
                    if (ytMatch && ytMatch[1]) {
                        mediaContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" class="w-full aspect-video" allowfullscreen frameborder="0"></iframe>`;
                    } else if (videoMatch) {
                        mediaContainer.innerHTML = `<video src="${news.mediaUrl}" class="w-full aspect-video object-cover" controls preload="metadata"></video>`;
                    } else {
                        const img = document.createElement('img');
                        img.src = news.mediaUrl;
                        img.className = 'w-full h-auto object-cover max-h-80 transition-transform duration-700 group-hover:scale-105 cursor-pointer';
                        
                        // Añadir evento para abrir foto en grande al pulsarla
                        img.onclick = () => window.open(news.mediaUrl, '_blank');
                        
                        mediaContainer.appendChild(img);
                    }
                    card.appendChild(mediaContainer);
                }

                const bottomBar = document.createElement('div');
                bottomBar.className = 'flex flex-wrap justify-between items-center mt-2 pt-4 border-t border-white/5 gap-3';
                const leftActions = document.createElement('div');
                leftActions.className = 'flex gap-2';

                const isLiked = news.likedBy && news.likedBy.includes(currentUserUid || 'local');
                const likeCount = news.likedBy ? news.likedBy.length : 0;
                
                const likeBtn = document.createElement('button');
                likeBtn.className = `flex items-center gap-2 text-sm font-bold px-4 py-2.5 rounded-xl transition-all border ${isLiked ? 'text-pink-400 bg-pink-500/10 border-pink-500/30 heart-active' : 'text-slate-400 bg-slate-800/50 border-slate-700 hover:text-pink-400'}`;
                likeBtn.innerHTML = `<i data-lucide="heart" class="w-4 h-4 ${isLiked ? 'fill-current' : ''}"></i> <span>${likeCount > 0 ? likeCount : 'Like'}</span>`;
                likeBtn.onclick = () => toggleLike(news.id, isLiked);
                leftActions.appendChild(likeBtn);

                const commentCount = news.comments ? news.comments.length : 0;
                const commentBtn = document.createElement('button');
                commentBtn.className = `flex items-center gap-2 text-sm font-bold px-4 py-2.5 rounded-xl transition-all border text-slate-400 bg-slate-800/50 border-slate-700 hover:text-cyan-400`;
                commentBtn.innerHTML = `<i data-lucide="message-square" class="w-4 h-4"></i> <span>${commentCount > 0 ? commentCount : 'Chat'}</span>`;
                commentBtn.onclick = () => {
                    if (openComments.has(news.id)) openComments.delete(news.id);
                    else openComments.add(news.id);
                    renderNews(); 
                };
                leftActions.appendChild(commentBtn);

                bottomBar.appendChild(leftActions);

                const rightActions = document.createElement('div');
                rightActions.className = 'flex gap-2 ml-auto';

                if (news.link) {
                    const linkBtn = document.createElement('a');
                    linkBtn.href = news.link;
                    linkBtn.target = '_self'; 
                    linkBtn.className = 'inline-flex items-center gap-2 text-sm font-bold text-white px-5 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 transition-colors';
                    linkBtn.innerHTML = `Ver <i data-lucide="external-link" class="w-4 h-4"></i>`;
                    rightActions.appendChild(linkBtn);
                }

                if (isAdmin) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'inline-flex items-center justify-center w-10 h-10 rounded-xl text-red-400 bg-red-500/10 hover:bg-red-500/20 transition-colors';
                    delBtn.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';
                    delBtn.onclick = () => deleteNewsItem(news.id);
                    rightActions.appendChild(delBtn);
                }

                if(rightActions.childNodes.length > 0) bottomBar.appendChild(rightActions);
                card.appendChild(bottomBar);

                const commentsSection = document.createElement('div');
                commentsSection.className = `comments-section mt-2 ${openComments.has(news.id) ? 'open' : ''}`;
                
                const commentsInner = document.createElement('div');
                commentsInner.className = 'pt-4 border-t border-white/5 flex flex-col gap-3';
                
                if (news.comments && news.comments.length > 0) {
                    const commentsList = document.createElement('div');
                    commentsList.className = 'flex flex-col gap-2 max-h-48 overflow-y-auto hide-scrollbar mb-2 px-1';
                    news.comments.forEach(c => {
                        commentsList.innerHTML += `
                            <div class="bg-slate-900/80 rounded-xl p-3 border border-white/5 text-sm">
                                <span class="font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400">${c.author}:</span> 
                                <span class="text-slate-300 ml-1">${c.text}</span>
                            </div>`;
                    });
                    commentsInner.appendChild(commentsList);
                }

                const commentForm = document.createElement('form');
                commentForm.className = 'flex gap-2';
                commentForm.onsubmit = (e) => {
                    e.preventDefault();
                    const input = commentForm.querySelector('input');
                    if(!input.value.trim()) return;
                    submitComment(news.id, input.value.trim());
                    input.value = '';
                };
                commentForm.innerHTML = `
                    <input type="text" placeholder="Escribe tu mensaje..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:border-cyan-500 outline-none transition-all focus:ring-1 focus:ring-cyan-500">
                    <button type="submit" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white px-4 py-2 rounded-xl transition-all shadow-lg"><i data-lucide="send" class="w-4 h-4"></i></button>
                `;
                commentsInner.appendChild(commentForm);
                commentsSection.appendChild(commentsInner);
                
                card.appendChild(commentsSection);
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin || !db) return;

            const newPost = {
                category: document.getElementById('news-category').value.trim(),
                text: document.getElementById('news-text').value,
                mediaUrl: document.getElementById('news-media').value.trim(),
                link: document.getElementById('news-link').value.trim(),
                timestamp: Date.now(),
                likedBy: [],
                comments: []
            };

            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> ENVIANDO A LA NUBE...';
            lucide.createIcons();

            try {
                await addDoc(collection(db, 'novedades'), newPost);
                
                // Limpiar los campos
                document.getElementById('news-text').value = '';
                document.getElementById('news-media').value = '';
                document.getElementById('news-link').value = '';
                
                showToast("¡NOVEDAD EN PISTA!");
                
                // Mover automáticamente a la pestaña correcta
                let catUpper = newPost.category.toUpperCase();
                let targetFilter = 'KRONO PERSONAL';
                if(catUpper.includes('KRONO DUAL')) targetFilter = 'KRONO DUAL';
                else if(catUpper.includes('TELEMETRY')) targetFilter = 'TELEMETRY';
                else if(catUpper.includes('FUTURAS APLICACIONES')) targetFilter = 'FUTURAS APLICACIONES';
                
                setFilter(targetFilter);
                
            } catch (error) {
                console.error("Error al guardar: ", error);
                showToast("Error. Revisa los permisos de Firebase", "error");
            } finally {
                btn.innerHTML = '<div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-cyan-600 opacity-80 group-hover:opacity-100 transition-opacity"></div><div class="relative flex justify-center items-center gap-2"><i data-lucide="zap" class="w-5 h-5 text-yellow-300"></i> FORZAR ENVÍO A PISTA</div>';
                lucide.createIcons();
            }
        });

        window.deleteNewsItem = function(docId) {
            askConfirmDialog(async () => {
                if (db) {
                    try {
                        await deleteDoc(doc(db, 'novedades', String(docId)));
                        showToast("Novedad borrada para todos");
                    } catch (e) {
                        showToast("Error al borrar", "error");
                    }
                }
            });
        };

        window.toggleLike = async function(docId, currentlyLiked) {
            if (!db || !currentUserUid) return;
            try {
                const postRef = doc(db, 'novedades', String(docId));
                if (currentlyLiked) await updateDoc(postRef, { likedBy: arrayRemove(currentUserUid) });
                else await updateDoc(postRef, { likedBy: arrayUnion(currentUserUid) });
            } catch(e) {}
        };

        window.closeNicknameModal = function() {
            document.getElementById('nickname-modal').classList.add('hidden');
            pendingCommentNewsId = null;
        };

        document.getElementById('nickname-form').addEventListener('submit', (e) => {
            e.preventDefault();
            userNickname = document.getElementById('nickname-input').value.trim();
            localStorage.setItem('slot_nickname', userNickname);
            closeNicknameModal();
            if (pendingCommentNewsId) {
                executeComment(pendingCommentNewsId.id, pendingCommentNewsId.text);
                pendingCommentNewsId = null;
            }
        });

        window.submitComment = function(newsId, text) {
            userNickname = userNickname || localStorage.getItem('slot_nickname');
            if (!userNickname) {
                pendingCommentNewsId = { id: newsId, text: text };
                document.getElementById('nickname-modal').classList.remove('hidden');
                return;
            }
            executeComment(newsId, text);
        };

        window.executeComment = async function(newsId, text) {
            if (!db) return;
            try {
                const newComment = { author: userNickname, text: text, timestamp: Date.now() };
                const postRef = doc(db, 'novedades', String(newsId));
                await updateDoc(postRef, { comments: arrayUnion(newComment) });
                openComments.add(newsId);
                showToast("Comentario publicado");
            } catch(e) { 
                showToast("Error al comentar", "error"); 
            }
        };

        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserUid = user.uid;
                        const newsRef = collection(db, 'novedades');
                        
                        onSnapshot(newsRef, (snapshot) => {
                            const fetchedNews = [];
                            snapshot.forEach((docSnap) => {
                                fetchedNews.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            
                            fetchedNews.sort((a, b) => b.timestamp - a.timestamp);
                            allNews = fetchedNews;
                            
                            document.getElementById('status-dot').className = "flex h-2.5 w-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]";
                            document.getElementById('status-dot').title = "Base de datos conectada";
                            
                            renderNews(); 
                        }, (error) => {
                            console.error("Error leyendo de Firebase:", error);
                            document.getElementById('status-dot').className = "flex h-2.5 w-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]";
                            const loadingState = document.getElementById('loading-state');
                            if (loadingState) loadingState.style.display = 'none';
                            renderNews();
                        });
                    }
                });

            } catch (error) {
                console.error("Fallo general al conectar con Firebase.", error);
                document.getElementById('status-dot').className = "flex h-2.5 w-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]";
                const loadingState = document.getElementById('loading-state');
                if (loadingState) loadingState.style.display = 'none';
                renderNews();
            }
        }

        initApp();
        lucide.createIcons();
    </script>
</body>
</html>
